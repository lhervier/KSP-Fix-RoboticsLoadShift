// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Keeps the moving part of a robotic part (piston, hinge, rotation servo, rotor) still while its vessel loads, as the
// rest of the vessel is. Without it, a robotic part bent by its load when the game was saved springs back to its
// target alone while the vessel loads, and KSP Community Fixes RoboticsDrift shifts the parts it carries with it.
servoStillWhilePacked = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line per robotic part kept still,
// each time its vessel loads.
logLevel = Info
